name: Threat Model Feedback
description: Share feedback on a threat model generated by this tool
title: "[Feedback] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a couple minutes to share feedback — it directly shapes what gets improved next.

  - type: dropdown
    id: usefulness
    attributes:
      label: How useful was this threat model?
      options:
        - Very useful
        - Somewhat useful
        - Not useful
    validations:
      required: true

  - type: dropdown
    id: most-valuable
    attributes:
      label: Which section was most valuable?
      options:
        - Executive summary
        - Architecture overview
        - Threats
        - Attack scenarios
        - Mitigations
        - Data classification
        - Other
    validations:
      required: false

  - type: textarea
    id: missing
    attributes:
      label: Was anything missing or wrong?
      placeholder: Describe what was missing or incorrect, or write "nothing"
    validations:
      required: false

  - type: textarea
    id: false-positives
    attributes:
      label: Were there any false positives — threats that don't actually apply?
      placeholder: Describe any false positives, or write "none"
    validations:
      required: false

  - type: dropdown
    id: rating
    attributes:
      label: "Overall quality rating (1 = poor, 5 = excellent)"
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
    validations:
      required: true

  - type: dropdown
    id: use-again
    attributes:
      label: Would you use this tool again?
      options:
        - "Yes"
        - Maybe
        - "No"
    validations:
      required: false

  - type: textarea
    id: comments
    attributes:
      label: Any additional comments?
    validations:
      required: false
